<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#000"/>
  <defs>
    <linearGradient id="m" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#909090"/>
      <stop offset="20%"  stop-color="#d0d0d0"/>
      <stop offset="45%"  stop-color="#f0f0f0"/>
      <stop offset="70%"  stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <!-- ══ HAT CROWN — angular W-top fedora ══ -->
  <polygon points="
    402,414
    418,302
    452,242
    500,218
    516,210
    540,208
    564,210
    580,218
    628,242
    662,302
    678,414
  " fill="url(#m)"/>
  <!-- Dark V-notch crease between two peaks -->
  <polygon points="520,213  540,238  560,213  540,208" fill="#111"/>

  <!-- ══ HAT BRIM ══ -->
  <polygon points="182,414  898,414  898,462  182,462" fill="url(#m)"/>

  <!-- ══ GLASSES ══ -->
  <ellipse cx="476" cy="500" rx="80" ry="54" fill="url(#m)"/>
  <ellipse cx="604" cy="500" rx="80" ry="54" fill="url(#m)"/>
  <ellipse cx="476" cy="500" rx="58" ry="36" fill="#111" opacity="0.3"/>
  <ellipse cx="604" cy="500" rx="58" ry="36" fill="#111" opacity="0.3"/>
  <rect x="532" y="484" width="28" height="34" rx="10" fill="url(#m)"/>

  <!-- ══ LEFT ARM — zig-zag lightning bolt ══
    Upper diagonal: body → far-left elbow (going left + slightly down)
    Lower diagonal: elbow → tip (going left + down)                    -->
  <!-- Upper thick bar -->
  <polygon points="
    420,470  420,438  316,470  316,504
  " fill="url(#m)"/>
  <!-- Elbow joint -->
  <polygon points="
    316,470  276,500  276,560  316,530  316,504
  " fill="url(#m)"/>
  <!-- Lower thick bar: elbow → lower tip -->
  <polygon points="
    316,530  276,560  224,700  262,714  308,568  316,560
  " fill="url(#m)"/>

  <!-- ══ RIGHT ARM — mirror ══ -->
  <!-- Upper thick bar -->
  <polygon points="
    660,470  660,438  764,470  764,504
  " fill="url(#m)"/>
  <!-- Elbow joint -->
  <polygon points="
    764,470  804,500  804,560  764,530  764,504
  " fill="url(#m)"/>
  <!-- Lower thick bar: elbow → lower tip -->
  <polygon points="
    764,530  804,560  856,700  818,714  772,568  764,560
  " fill="url(#m)"/>
</svg>
